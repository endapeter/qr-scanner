<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Attendance Scanner</title>

	<style>
		:root{
			--bg: #f5f7fb;
			--card: #ffffff;
			--muted: #6b7280;
			--accent: #2563eb;
			--success: #10b981;
			--danger: #ef4444;
			font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
		}

		/* Make box-sizing global to avoid overflow issues */
		*, *::before, *::after { box-sizing: border-box; }

		html,body{height:100%;margin:0;background:var(--bg);}

		/* container is fluid and vertical: preview on top, panels below */
		.container{
			width: calc(100% - 2rem);
			max-width: 960px;
			margin: 1rem auto;
			padding: 1rem;
			display:flex;
			flex-direction:column;
			gap:1rem;
		}

		.left, .right{
			background:var(--card);
			border-radius:12px;
			box-shadow:0 6px 18px rgba(15,23,42,0.06);
			padding:1rem;
		}

		/* left is the preview area, full width */
		.left{width:100%;}

		/* right is the area below the preview, full width — same padding as
		   .left so the panels align; no extra inset on the content */
		.right{width:100%;display:flex;flex-direction:column;gap:1rem;}

		h1{font-size:1.25rem;margin:0 0 0.5rem 0;color:#0f172a;}
		#tracking-banner{
			font-size:.85rem;color:var(--muted);margin-bottom:.75rem;
		}
		#tracking-banner strong{color:var(--accent);}
		.controls{display:flex;gap:.5rem;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;}
		select, button{
			padding:.5rem .75rem;border-radius:8px;border:1px solid #e6eefc;background:white;
			font-size:.95rem;
		}
		button{
			background:var(--accent);color:white;border:0;cursor:pointer;
		}
		button.secondary{background:transparent;color:var(--accent);border:1px solid rgba(37,99,235,0.12);}

		#reader{
			width:100%;
			aspect-ratio: 1 / 1;
			border-radius:8px;
			overflow:hidden;
			background:#000;
			display:flex;
			align-items:center;
			justify-content:center;
			color:#9aa6bf;
			position:relative;
		}

		/* Ensure the internal video/canvas keep aspect and fill the square */
		#reader video, #reader canvas {
			width: 100% !important;
			height: 100% !important;
			object-fit: cover;
		}

		.panel-title{font-size:.85rem;color:var(--muted);margin-bottom:.35rem;}
		.photo{
			height:220px;
			background:linear-gradient(180deg,#eef2ff,white);
			border-radius:8px;
			display:flex;
			align-items:center;
			justify-content:center;
			overflow:hidden;
			border:1px solid rgba(15,23,42,0.03);
			width:100%;
		}
		.photo img{width:100%;height:100%;object-fit:cover;}
		.info-card{background:linear-gradient(180deg,#fff,#fbfdff);padding:.75rem;border-radius:8px;border:1px solid rgba(15,23,42,0.03);width:100%;}
		.firstname{font-weight:600;font-size:1.15rem;color:#0f172a;}
		.status{font-size:.9rem;color:var(--muted);margin-top:.25rem;}
		.duplicate{color:var(--danger);font-weight:600;}
		.success-flash{box-shadow:0 8px 30px rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.12);}
		.small-muted{font-size:.8rem;color:var(--muted);}

		/* mobile friendly adjustments */
		@media (max-width:720px){
			.container{ padding:0.75rem; gap:0.75rem; }
			h1{font-size:1rem;}
			.controls{gap:.45rem;}
			select, button{font-size:.9rem;padding:.45rem .6rem;}
			.photo{height:200px;}
		}

		/* small screens very narrow */
		@media (max-width:420px){
			.container{ width: calc(100% - 1rem); padding:0.5rem; }
			.photo{height:180px;}
			.firstname{font-size:1rem;}
		}
	</style>

	<script src="/public/html5-qrcode.min.js"></script>
</head>
<body>

	<div class="container">
		<div class="left">
			<h1>Attendance Scanner</h1>
			<div id="tracking-banner">Tracking for: <strong id="active-class">…</strong></div>

			<div class="controls">
				<select id="camera-select"><option>Loading cameras...</option></select>
				<button id="start-btn">Start Scanning</button>
				<button id="stop-btn" class="secondary" style="display:none;">Stop</button>
			</div>

			<!-- #reader is a square (aspect-ratio) so the overlay never scales oddly -->
			<div id="reader">Camera preview will appear here</div>

			<div style="margin-top:.75rem;">
				<span class="small-muted">Status:</span> <span id="status" class="small-muted">Idle</span>
			</div>
		</div>

		<!-- panels sit under the preview -->
		<div class="right">
			<div class="info-card">
				<div class="panel-title">Photo</div>
				<div id="photo-panel" class="photo">
					<span class="small-muted">No photo yet</span>
				</div>
			</div>

			<div class="info-card">
				<div class="panel-title">First Name</div>
				<div id="firstname-panel" class="firstname">—</div>
				<div class="status">Surname: <span id="surname">—</span></div>
			</div>
		</div>
	</div>

	<script>
		'use strict';

		const serverUrl = "/log";

		const photoPanel = document.getElementById('photo-panel');
		const firstnamePanel = document.getElementById('firstname-panel');
		const surnameSpan = document.getElementById('surname');
		const statusSpan = document.getElementById('status');
		const activeClassSpan = document.getElementById('active-class');
		const startBtn = document.getElementById('start-btn');
		const stopBtn = document.getElementById('stop-btn');
		const cameraSelect = document.getElementById('camera-select');
		const readerDiv = document.getElementById('reader');

		let html5QrCode = null;
		let currentCameraId = null;
		let scanning = false;

		/* ---------------------------------------------------------------
		 * Active class: which class the server is currently tracking for.
		 * Poll occasionally so a class switch on the admin dashboard is
		 * picked up without a page reload.
		 * --------------------------------------------------------------- */
		async function refreshActiveClass(){
			try{
				const resp = await fetch('/api/active-class', {cache: 'no-store'});
				if(resp.ok){
					const data = await resp.json();
					activeClassSpan.textContent = data.class || '(none — set one on the admin dashboard)';
				}
			}catch(e){
				activeClassSpan.textContent = '(server unreachable)';
			}
		}
		refreshActiveClass();
		setInterval(refreshActiveClass, 30000);

		/* Populate camera list */
		Html5Qrcode.getCameras().then(cameras => {
			cameraSelect.innerHTML = '';
			if (!cameras || cameras.length === 0) {
				cameraSelect.innerHTML = '<option>No cameras found</option>';
				return;
			}
			cameras.forEach((cam, idx) => {
				const opt = document.createElement('option');
				opt.value = cam.id;
				opt.textContent = cam.label || `Camera ${idx+1}`;
				cameraSelect.appendChild(opt);
			});
			currentCameraId = cameraSelect.value;
		}).catch(err => {
			cameraSelect.innerHTML = `<option>Error: ${err}</option>`;
		});

		cameraSelect.addEventListener('change', () => {
			currentCameraId = cameraSelect.value;
		});

		/* Play a short "ding" using WebAudio */
		function playDing(){
			try{
				const ctx = new (window.AudioContext || window.webkitAudioContext)();
				const o = ctx.createOscillator();
				const g = ctx.createGain();
				o.type = 'sine';
				o.frequency.value = 880;
				o.connect(g); g.connect(ctx.destination);
				const now = ctx.currentTime;
				g.gain.setValueAtTime(0.0001, now);
				g.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
				o.start(now);
				g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
				o.stop(now + 0.2);
			}catch(e){
				// ignore audio errors
			}
		}

		/* Load photo into the photo panel by passport_picture filename */
		function setPhotoFromPassport(filename){
			if(!filename){
				photoPanel.innerHTML = '<span class="small-muted">No photo available</span>';
				return;
			}
			photoPanel.innerHTML = '<span class="small-muted">Searching photo...</span>';
			const path = `/public/photos/${encodeURIComponent(filename)}`;
			fetch(path, {method: 'HEAD'}).then(resp => {
				if(resp.ok){
					photoPanel.innerHTML = `<img src="${path}" alt="passport">`;
				} else {
					photoPanel.innerHTML = '<span class="small-muted">Photo not found</span>';
				}
			}).catch(() => {
				photoPanel.innerHTML = '<span class="small-muted">Photo not found</span>';
			});
		}

		/* Called on successful QR decode */
		function onScanSuccess(decodedText, decodedResult){
			console.log("QR scanned (raw):", decodedText, decodedResult);

			let entryObj;
			try{
				entryObj = JSON.parse(decodedText);
			}catch(e){
				setStatus('Invalid QR code (not JSON)', true);
				return;
			}

			// Show the person immediately; the server remains authoritative.
			firstnamePanel.textContent = entryObj.first_name || "N/A";
			surnameSpan.textContent = entryObj.surname || "N/A";
			setPhotoFromPassport(entryObj.passport_picture);
			readerDiv.classList.add('success-flash');
			setTimeout(() => readerDiv.classList.remove('success-flash'), 350);

			fetch(serverUrl, {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify(entryObj)
			}).then(async resp => {
				if(!resp.ok){
					const body = await resp.json().catch(() => ({}));
					if(resp.status === 409 && body.status === 'no_class'){
						setStatus('No class selected — ask admin to pick one', true);
					}else{
						console.error('Server returned error', resp.status, body);
						setStatus(`Server error ${resp.status}`, true);
					}
					return;
				}
				const data = await resp.json();
				if(data.status === 'duplicate'){
					setStatus(`${entryObj.first_name || 'Student'} already scanned for ${data.class}`, true);
				}else{
					setStatus(`Recorded for ${data.class}`);
					playDing();
				}
				refreshActiveClass();
			}).catch(err => {
				console.error('Network error sending data:', err);
				setStatus('Network error sending data (see console)', true);
			});
		}

		function setStatus(text, isWarning){
			statusSpan.textContent = text;
			statusSpan.classList.toggle('duplicate', Boolean(isWarning));
		}

		function onScanFailure(){
			// silent: this fires constantly while the camera searches
		}

		/* Start / Stop */
		startBtn.addEventListener('click', () => {
			if(scanning) return;
			if(!currentCameraId){
				setStatus('No camera selected', true);
				return;
			}
			html5QrCode = new Html5Qrcode("reader");
			const side = Math.max(100, Math.floor(Math.min(
				readerDiv.clientWidth, readerDiv.clientHeight || readerDiv.clientWidth) * 0.75));
			html5QrCode.start(
				{ deviceId: { exact: currentCameraId } },
				{ fps: 10, qrbox: side },
				onScanSuccess,
				onScanFailure
			).then(() => {
				scanning = true;
				startBtn.style.display = 'none';
				stopBtn.style.display = '';
				setStatus('Scanning…');
			}).catch(err => {
				setStatus('Failed to start camera', true);
				console.error(err);
			});
		});

		stopBtn.addEventListener('click', () => {
			if(!scanning || !html5QrCode) return;
			html5QrCode.stop().then(() => html5QrCode.clear()).then(() => {
				scanning = false;
				startBtn.style.display = '';
				stopBtn.style.display = 'none';
				setStatus('Stopped');
				readerDiv.innerHTML = 'Camera preview will appear here';
			}).catch(err => {
				console.error('Error stopping camera', err);
			});
		});
	</script>
</body>
</html>
