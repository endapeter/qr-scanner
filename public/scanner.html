<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Attendance Scanner</title>

	<style>
		:root{
			--bg: #f5f7fb;
			--card: #ffffff;
			--muted: #6b7280;
			--accent: #2563eb;
			--success: #10b981;
			--danger: #ef4444;
			font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
		}

		*, *::before, *::after { box-sizing: border-box; }

		/* Full-height flex column: preview card grows to fit, result card
		   fills exactly the remaining viewport height — no page scrolling. */
		html,body{height:100%;margin:0;background:var(--bg);}
		.page{
			height:100%;
			max-width:960px;
			margin:0 auto;
			padding:1rem;
			display:flex;
			flex-direction:column;
			gap:1rem;
		}

		.card{
			background:var(--card);
			border-radius:12px;
			box-shadow:0 6px 18px rgba(15,23,42,0.06);
			padding:1rem;
		}

		h1{font-size:1.25rem;margin:0 0 0.5rem 0;color:#0f172a;}
		#tracking-banner{font-size:.85rem;color:var(--muted);margin-bottom:.75rem;}
		#tracking-banner strong{color:var(--accent);}

		.controls{display:flex;gap:.5rem;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;}
		select, button{
			padding:.5rem .75rem;border-radius:8px;border:1px solid #e6eefc;background:white;
			font-size:.95rem;
		}
		button{background:var(--accent);color:white;border:0;cursor:pointer;}
		button.secondary{background:transparent;color:var(--accent);border:1px solid rgba(37,99,235,0.12);}

		#reader{
			width:100%;
			aspect-ratio: 1 / 1;
			border-radius:8px;
			overflow:hidden;
			background:#000;
			display:flex;
			align-items:center;
			justify-content:center;
			color:#9aa6bf;
			position:relative;
		}
		#reader video, #reader canvas {
			width: 100% !important;
			height: 100% !important;
			object-fit: cover;
		}

		.status-line{font-size:.9rem;color:var(--muted);margin-top:.75rem;}
		.duplicate{color:var(--danger);font-weight:600;}
		.success-flash{box-shadow:0 8px 30px rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.12);}
		.small-muted{font-size:.8rem;color:var(--muted);}

		/* ---------------------------------------------------------------
		 * Result card: photo on the left at a fixed aspect ratio (passport
		 * photos are ~3.5:4.5), name fields on the right. The photo frame
		 * keeps its size for every scan — only the image inside changes —
		 * so nothing moves between scans.
		 * --------------------------------------------------------------- */
		.result{flex:1 1 auto; min-height:0; display:flex; padding:1rem;}
		.result-body{flex:1 1 auto; min-width:0; min-height:0; display:flex; gap:1rem; align-items:stretch;}

		.photo-frame{
			/* Fixed frame, computed by JS to use the height left over after
			   the preview card; identical from photo to photo. */
			flex:0 0 auto;
			align-self:center;
			aspect-ratio: 35 / 45;             /* passport photo ratio */
			max-height:100%;
			max-width:45%;
			border-radius:8px;
			background:linear-gradient(180deg,#eef2ff,white);
			border:1px solid rgba(15,23,42,0.03);
			display:flex;
			align-items:center;
			justify-content:center;
			overflow:hidden;
		}
		.photo-frame img{
			/* contain, not cover: the FULL photo is always visible inside
			   the frame, letterboxed — never cropped. */
			width:100%; height:100%;
			object-fit:contain;
			display:block;
		}

		.person-info{
			flex:1 1 auto;
			min-width:0;
			display:flex;
			flex-direction:column;
			justify-content:center;
			gap:.35rem;
			/* long names wrap instead of stretching the card */
			overflow-wrap:anywhere;
		}
		.firstname{font-weight:600;font-size:1.15rem;color:#0f172a;line-height:1.25;}
		.surname{font-size:1rem;color:#0f172a;line-height:1.3;}
		.person-labels{font-size:.75rem;color:var(--muted);}

		/* mobile friendly adjustments */
		@media (max-width:720px){
			.page{ padding:0.75rem; gap:0.75rem; }
			h1{font-size:1rem;}
			.controls{gap:.45rem;}
			select, button{font-size:.9rem;padding:.45rem .6rem;}
		}

		@media (max-width:420px){
			.page{ padding:0.5rem; gap:0.5rem; }
			h1{font-size:1rem;}
			.firstname{font-size:1rem;}
			.surname{font-size:.9rem;}
			.result{padding:.75rem;}
			.result-body{gap:.75rem;}
		}
	</style>

	<script src="/public/html5-qrcode.min.js"></script>
</head>
<body>

	<div class="page">
		<!-- Preview card: camera + controls. Everything above the result card
		     sizes itself to content; the result card gets what's left. -->
		<div class="card">
			<h1>Attendance Scanner</h1>
			<div id="tracking-banner">Tracking for: <strong id="active-class">…</strong></div>

			<div class="controls">
				<select id="camera-select"><option>Loading cameras...</option></select>
				<button id="start-btn">Start Scanning</button>
				<button id="stop-btn" class="secondary" style="display:none;">Stop</button>
			</div>

			<!-- #reader is a square (aspect-ratio) so the overlay never scales oddly -->
			<div id="reader">Camera preview will appear here</div>

			<div class="status-line">
				<span class="small-muted">Status:</span> <span id="status" class="small-muted">Idle</span>
			</div>
		</div>

		<!-- Result card: photo left, name right; fills the remaining height
		     of the screen without scrolling. -->
		<div class="card result">
			<div class="result-body">
				<div id="photo-frame" class="photo-frame">
					<span class="small-muted">No photo yet</span>
				</div>
				<div class="person-info">
					<div><span class="person-labels">First name</span><div id="firstname-panel" class="firstname">—</div></div>
					<div><span class="person-labels">Surname</span><div id="surname-panel" class="surname">—</div></div>
				</div>
			</div>
		</div>
	</div>

	<script>
		'use strict';

		const serverUrl = "/log";

		const photoFrame = document.getElementById('photo-frame');
		const firstnamePanel = document.getElementById('firstname-panel');
		const surnamePanel = document.getElementById('surname-panel');
		const statusSpan = document.getElementById('status');
		const activeClassSpan = document.getElementById('active-class');
		const startBtn = document.getElementById('start-btn');
		const stopBtn = document.getElementById('stop-btn');
		const cameraSelect = document.getElementById('camera-select');
		const readerDiv = document.getElementById('reader');

		let html5QrCode = null;
		let currentCameraId = null;
		let scanning = false;

		/* ---------------------------------------------------------------
		 * Photo frame sizing: the frame must be identical for every photo
		 * so nothing shifts between scans. We compute it once from the
		 * height left over in the viewport after the preview card, then
		 * freeze it. The frame is the largest passport-ratio box (35:45)
		 * that fits: (leftover height) tall and at most 45% of the card
		 * width — whichever binds first.
		 * --------------------------------------------------------------- */
		function sizePhotoFrame(){
			const frame = photoFrame;
			frame.style.width = '';
			frame.style.height = '';

			const bodyH = frame.parentElement.clientHeight;   // inner height of result-body
			if(bodyH > 0){
				const h = Math.floor(bodyH);
				const w = Math.floor(h * 35 / 45);
				frame.style.width = w + 'px';
				frame.style.height = h + 'px';
			}
		}
		window.addEventListener('load', sizePhotoFrame);
		window.addEventListener('resize', sizePhotoFrame);
		window.addEventListener('orientationchange', () => setTimeout(sizePhotoFrame, 200));
		if(document.fonts && document.fonts.ready){ document.fonts.ready.then(sizePhotoFrame); }
		document.addEventListener('visibilitychange', () => {
			if(!document.hidden) sizePhotoFrame();
		});

		/* ---------------------------------------------------------------
		 * Active class: which class the server is currently tracking for.
		 * --------------------------------------------------------------- */
		async function refreshActiveClass(){
			try{
				const resp = await fetch('/api/active-class', {cache: 'no-store'});
				if(resp.ok){
					const data = await resp.json();
					activeClassSpan.textContent = data.class || '(none — set one on the admin dashboard)';
				}
			}catch(e){
				activeClassSpan.textContent = '(server unreachable)';
			}
		}
		refreshActiveClass();
		setInterval(refreshActiveClass, 30000);

		/* Populate camera list */
		Html5Qrcode.getCameras().then(cameras => {
			cameraSelect.innerHTML = '';
			if (!cameras || cameras.length === 0) {
				cameraSelect.innerHTML = '<option>No cameras found</option>';
				return;
			}
			cameras.forEach((cam, idx) => {
				const opt = document.createElement('option');
				opt.value = cam.id;
				opt.textContent = cam.label || `Camera ${idx+1}`;
				cameraSelect.appendChild(opt);
			});
			currentCameraId = cameraSelect.value;
		}).catch(err => {
			cameraSelect.innerHTML = `<option>Error: ${err}</option>`;
		});

		cameraSelect.addEventListener('change', () => {
			currentCameraId = cameraSelect.value;
		});

		/* Play a short "ding" using WebAudio */
		function playDing(){
			try{
				const ctx = new (window.AudioContext || window.webkitAudioContext)();
				const o = ctx.createOscillator();
				const g = ctx.createGain();
				o.type = 'sine';
				o.frequency.value = 880;
				o.connect(g); g.connect(ctx.destination);
				const now = ctx.currentTime;
				g.gain.setValueAtTime(0.0001, now);
				g.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
				o.start(now);
				g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
				o.stop(now + 0.2);
			}catch(e){
				// ignore audio errors
			}
		}

		/* Load photo into the fixed frame by passport_picture filename.
		 * object-fit:contain in CSS guarantees the full photo is visible. */
		function setPhotoFromPassport(filename){
			if(!filename){
				photoFrame.innerHTML = '<span class="small-muted">No photo available</span>';
				return;
			}
			const path = `/public/photos/${encodeURIComponent(filename)}`;
			fetch(path, {method: 'HEAD'}).then(resp => {
				if(resp.ok){
					photoFrame.innerHTML = `<img src="${path}" alt="passport">`;
				} else {
					photoFrame.innerHTML = '<span class="small-muted">Photo not found</span>';
				}
			}).catch(() => {
				photoFrame.innerHTML = '<span class="small-muted">Photo not found</span>';
			});
		}

		/* Called on successful QR decode */
		function onScanSuccess(decodedText, decodedResult){
			console.log("QR scanned (raw):", decodedText, decodedResult);

			let entryObj;
			try{
				entryObj = JSON.parse(decodedText);
			}catch(e){
				setStatus('Invalid QR code (not JSON)', true);
				return;
			}

			// Show the person immediately; the server remains authoritative.
			firstnamePanel.textContent = entryObj.first_name || "N/A";
			surnamePanel.textContent = entryObj.surname || "N/A";
			setPhotoFromPassport(entryObj.passport_picture);
			readerDiv.classList.add('success-flash');
			setTimeout(() => readerDiv.classList.remove('success-flash'), 350);

			fetch(serverUrl, {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify(entryObj)
			}).then(async resp => {
				if(!resp.ok){
					const body = await resp.json().catch(() => ({}));
					if(resp.status === 409 && body.status === 'no_class'){
						setStatus('No class selected — ask admin to pick one', true);
					}else{
						console.error('Server returned error', resp.status, body);
						setStatus(`Server error ${resp.status}`, true);
					}
					return;
				}
				const data = await resp.json();
				if(data.status === 'duplicate'){
					setStatus(`${entryObj.first_name || 'Student'} already scanned for ${data.class}`, true);
				}else{
					setStatus(`Recorded for ${data.class}`);
					playDing();
				}
				refreshActiveClass();
			}).catch(err => {
				console.error('Network error sending data:', err);
				setStatus('Network error sending data (see console)', true);
			});
		}

		function setStatus(text, isWarning){
			statusSpan.textContent = text;
			statusSpan.classList.toggle('duplicate', Boolean(isWarning));
		}

		function onScanFailure(){
			// silent: this fires constantly while the camera searches
		}

		/* Start / Stop */
		startBtn.addEventListener('click', () => {
			if(scanning) return;
			if(!currentCameraId){
				setStatus('No camera selected', true);
				return;
			}
			html5QrCode = new Html5Qrcode("reader");
			const side = Math.max(100, Math.floor(Math.min(
				readerDiv.clientWidth, readerDiv.clientHeight || readerDiv.clientWidth) * 0.75));
			html5QrCode.start(
				{ deviceId: { exact: currentCameraId } },
				{ fps: 10, qrbox: side },
				onScanSuccess,
				onScanFailure
			).then(() => {
				scanning = true;
				startBtn.style.display = 'none';
				stopBtn.style.display = '';
				setStatus('Scanning…');
			}).catch(err => {
				setStatus('Failed to start camera', true);
				console.error(err);
			});
		});

		stopBtn.addEventListener('click', () => {
			if(!scanning || !html5QrCode) return;
			html5QrCode.stop().then(() => html5QrCode.clear()).then(() => {
				scanning = false;
				startBtn.style.display = '';
				stopBtn.style.display = 'none';
				setStatus('Stopped');
				readerDiv.innerHTML = 'Camera preview will appear here';
			}).catch(err => {
				console.error('Error stopping camera', err);
			});
		});
	</script>
</body>
</html>
